<h2>Reset your SmartNest password</h2>
<p>We received a request to reset your password. This link expires in one hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>If you didn't request this, you can ignore this email — your password won't change.</p>
